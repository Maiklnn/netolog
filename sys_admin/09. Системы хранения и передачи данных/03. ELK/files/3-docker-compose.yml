version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.name=my-random-cluster-xyz789
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elk
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - elk
    depends_on:
      - elasticsearch

  nginx:
    image: nginx:latest
    container_name: nginx
    user: root
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d   # переопределяем конфиг
      - nginx_logs:/var/log/nginx          # том для логов
    command: sh -c "rm -f /var/log/nginx/access.log && touch /var/log/nginx/access.log && chown nginx:nginx /var/log/nginx/access.log && nginx -g 'daemon off;'"
    networks:
      - elk

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: logstash
    user: root               # нужно для чтения логов из тома nginx
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - nginx_logs:/var/log/nginx
    environment:
      - XPACK_MONITORING_ENABLED=false
    ports:
      - "9600:9600"
    networks:
      - elk
    depends_on:
      - elasticsearch
      - nginx

networks:
  elk:
    driver: bridge

volumes:
  es_data:
  nginx_logs:
