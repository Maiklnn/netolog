# Terraform CI/CD Pipeline for GitLab

stages:
  - validate
  - plan
  - apply
  - destroy

variables:
  # Terraform version
  TF_VERSION: "1.5.0"
  # Поставьте флаг 'true' чтобы автоматически применять изменения
  TF_AUTO_APPLY: "false"
  
  # GitLab variables (настройте в CI/CD Variables)
  # TF_VAR_aws_access_key: $AWS_ACCESS_KEY
  # TF_VAR_aws_secret_key: $AWS_SECRET_KEY

cache:
  paths:
    - ${CI_PROJECT_DIR}/.terraform/*
    
before_script:
  - apk add --no-cache curl jq python3 py3-pip git
  - curl -LO https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
  - unzip terraform_${TF_VERSION}_linux_amd64.zip -d /usr/local/bin/
  - rm terraform_${TF_VERSION}_linux_amd64.zip
  - terraform --version
  - alias python=python3

# Job: Проверка форматирования
terraform_fmt:
  stage: validate
  script:
    - terraform fmt -check -diff -recursive
  allow_failure: false
  tags:
    - docker

# Job: Валидация конфигурации
terraform_validate:
  stage: validate
  script:
    - terraform init -backend=false
    - terraform validate
  tags:
    - docker

# Job: Секретный сканер (проверка на секреты в коде)
secret_detection:
  stage: validate
  script:
    - apk add git
    - git log --all --full-history --pretty=oneline | grep -i "secret\|key\|password\|token" && exit 1 || echo "No secrets found in commits"
  allow_failure: true
  tags:
    - docker

# Job: План Terraform (только для ветки main)
terraform_plan:
  stage: plan
  script:
    - terraform init
    - terraform plan -out=plan.tfplan
    - terraform show -no-color plan.tfplan > plan.txt
  artifacts:
    paths:
      - plan.tfplan
      - plan.txt
    expire_in: 7 days
    when: on_success
  only:
    - main
    - merge_requests
  tags:
    - docker

# Job: Применение Terraform (только для ветки main и ручной запуск)
terraform_apply:
  stage: apply
  script:
    - terraform init
    - terraform apply -auto-approve plan.tfplan
  dependencies:
    - terraform_plan
  when: manual
  only:
    - main
  tags:
    - docker

# Job: Уничтожение инфраструктуры (ручной запуск)
terraform_destroy:
  stage: destroy
  script:
    - terraform init
    - terraform destroy -auto-approve
  when: manual
  only:
    - main
  tags:
    - docker

# Job: Отчет о ресурсах
terraform_output:
  stage: apply
  script:
    - terraform init
    - terraform output -json > output.json
  artifacts:
    paths:
      - output.json
    expire_in: 30 days
  dependencies:
    - terraform_apply
  only:
    - main
  when: on_success
  tags:
    - docker

# Job: Уведомление в Telegram (если настроен)
telegram_notification:
  stage: validate
  script:
    - |
      if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
        curl -s -X POST https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage \
          -d chat_id=$TELEGRAM_CHAT_ID \
          -d text="🚀 Pipeline: $CI_PROJECT_NAME%0A
          Status: $CI_JOB_STATUS%0A
          Branch: $CI_COMMIT_REF_NAME%0A
          Commit: $CI_COMMIT_SHORT_SHA%0A
          Author: $CI_COMMIT_AUTHOR%0A
          Link: $CI_PIPELINE_URL"
      else
        echo "Telegram notifications not configured"
      fi
  allow_failure: true
  only:
    - main
  tags:
    - docker
