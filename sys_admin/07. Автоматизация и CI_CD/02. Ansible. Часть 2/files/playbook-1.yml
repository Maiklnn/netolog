---
- name: Download and extract archive
  hosts: my
  vars:
    # Измените версию здесь, если нужно установить другую
    kafka_version: "3.6.0"
    scala_version: "2.13"
    kafka_tgz: "kafka_{{ scala_version }}-{{ kafka_version }}.tgz"
    # ГЛАВНОЕ ИЗМЕНЕНИЕ: используем archive.apache.org вместо downloads.apache.org
    kafka_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/{{ kafka_tgz }}"
  tasks:
    - name: Create extraction directory
      file:
        path: /tmp/kafka
        state: directory
        mode: '0755'

    - name: Download archive
      get_url:
        url: "{{ kafka_url }}"
        dest: "/tmp/{{ kafka_tgz }}"
        # Добавляем таймаут на случай медленного соединения с архивом
        timeout: 120
